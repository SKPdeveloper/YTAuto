<!-- Log Entry Component (HTMX partial) -->
<div class="flex items-start space-x-2 text-sm">
    <!-- Level Icon -->
    <div class="flex-shrink-0 mt-0.5
        {% if log.level == 'info' %}text-blue-400
        {% elif log.level == 'success' %}text-green-400
        {% elif log.level == 'warning' %}text-yellow-400
        {% elif log.level == 'error' %}text-red-400
        {% else %}text-gray-400
        {% endif %}">
        {% if log.level == 'info' %}
        <i data-lucide="info" class="w-3 h-3"></i>
        {% elif log.level == 'success' %}
        <i data-lucide="check" class="w-3 h-3"></i>
        {% elif log.level == 'warning' %}
        <i data-lucide="alert-triangle" class="w-3 h-3"></i>
        {% elif log.level == 'error' %}
        <i data-lucide="x-circle" class="w-3 h-3"></i>
        {% else %}
        <i data-lucide="circle" class="w-3 h-3"></i>
        {% endif %}
    </div>

    <!-- Content -->
    <div class="flex-1 min-w-0">
        <div class="text-gray-300 break-words">{{ log.message }}</div>
        <div class="text-xs text-gray-600 mt-0.5">
            {{ log.timestamp.strftime('%H:%M:%S') if log.timestamp else '' }}
        </div>
    </div>
</div>
