<!-- New Channel Modal -->
<div class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl border border-gray-200 w-full max-w-lg shadow-2xl" onclick="event.stopPropagation()">
        <!-- Header -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
            <h2 class="text-xl font-semibold text-gray-800 flex items-center space-x-2">
                <i data-lucide="plus-circle" class="w-6 h-6 text-blue-600"></i>
                <span>Новий канал</span>
            </h2>
            <button onclick="document.querySelector('.modal-backdrop').remove()" class="text-gray-400 hover:text-gray-600 transition-smooth">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
        </div>

        <!-- Form -->
        <form
            hx-post="/api/channel/create"
            hx-encoding="multipart/form-data"
            hx-target="body"
            class="p-6 space-y-6"
        >
            <!-- Channel Name -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Назва каналу <span class="text-red-500">*</span>
                </label>
                <input
                    type="text"
                    name="name"
                    required
                    placeholder="Наприклад: Glaze City"
                    class="w-full bg-gray-50 border border-gray-300 rounded-lg px-4 py-3 text-gray-800 placeholder-gray-400 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-smooth"
                >
            </div>

            <!-- Folder Path -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Шлях до папки <span class="text-red-500">*</span>
                </label>
                <input
                    type="text"
                    name="folder_path"
                    required
                    placeholder="C:\Projects\MyChannel"
                    class="w-full bg-gray-50 border border-gray-300 rounded-lg px-4 py-3 text-gray-800 placeholder-gray-400 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-smooth font-mono text-sm"
                >
                <p class="text-xs text-gray-500 mt-1">Папка повинна існувати. Туди будуть збережені конфігураційні файли.</p>
            </div>

            <!-- File Uploads -->
            <div class="space-y-4">
                <h3 class="text-sm font-medium text-gray-700">Конфігураційні файли (опціонально)</h3>

                <!-- .env file -->
                <div class="flex items-center space-x-4">
                    <div class="flex-1">
                        <label class="block text-sm text-gray-500 mb-1">.env файл (API ключі)</label>
                        <input
                            type="file"
                            name="env_file"
                            accept=".env"
                            class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200 cursor-pointer"
                        >
                    </div>
                </div>

                <!-- Prompt Generation file (GEN1) -->
                <div class="flex items-center space-x-4">
                    <div class="flex-1">
                        <label class="block text-sm text-gray-500 mb-1">GEN1.txt (Creative Director)</label>
                        <input
                            type="file"
                            name="prompt_generation_file"
                            accept=".txt"
                            class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200 cursor-pointer"
                        >
                    </div>
                </div>

                <!-- Prompt Validation file -->
                <div class="flex items-center space-x-4">
                    <div class="flex-1">
                        <label class="block text-sm text-gray-500 mb-1">VAL_IMG.txt (Validator)</label>
                        <input
                            type="file"
                            name="prompt_validation_file"
                            accept=".txt"
                            class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200 cursor-pointer"
                        >
                    </div>
                </div>
            </div>

            <!-- Default Settings -->
            <div class="grid grid-cols-2 gap-4">
                <!-- Default Format -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Формат за замовчуванням</label>
                    <select
                        name="default_format"
                        class="w-full bg-gray-50 border border-gray-300 rounded-lg px-4 py-3 text-gray-800 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-smooth"
                    >
                        <option value="9:16" selected>9:16 (Shorts/Reels)</option>
                        <option value="1:1">1:1 (Квадрат)</option>
                        <option value="16:9">16:9 (YouTube)</option>
                    </select>
                </div>

                <!-- Default Engine -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Движок за замовчуванням</label>
                    <select
                        name="default_engine"
                        class="w-full bg-gray-50 border border-gray-300 rounded-lg px-4 py-3 text-gray-800 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-smooth"
                    >
                        <option value="higgsfield" selected>Higgsfield</option>
                        <option value="comfyui">ComfyUI</option>
                    </select>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center justify-end space-x-3 pt-4 border-t border-gray-200">
                <button
                    type="button"
                    onclick="document.querySelector('.modal-backdrop').remove()"
                    class="px-4 py-2 text-gray-500 hover:text-gray-700 transition-smooth"
                >
                    Скасувати
                </button>
                <button
                    type="submit"
                    class="flex items-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition-smooth"
                >
                    <i data-lucide="check" class="w-4 h-4"></i>
                    <span>Створити канал</span>
                    <span class="htmx-indicator">
                        <i data-lucide="loader" class="w-4 h-4 animate-spin"></i>
                    </span>
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    lucide.createIcons();
</script>
